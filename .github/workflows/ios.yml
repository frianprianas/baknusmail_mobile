name: Build iOS Simulator App for Appetize.io

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios-x86-simulator:
    runs-on: macos-13 # macos-13 uses Intel x86_64 runner compatible with Appetize.io

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build x86_64 iOS Simulator App
        run: |
          flutter build ios --simulator --no-codesign
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -sdk iphonesimulator -arch x86_64 ONLY_ACTIVE_ARCH=NO build

      - name: Compress x86_64 Runner.app into ZIP for Appetize.io
        run: |
          cd build/ios/iphonesimulator
          zip -r Runner.app.zip Runner.app

      - name: Upload iOS Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-runner-app
          path: build/ios/iphonesimulator/Runner.app.zip
