name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios-simulator:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS Simulator App for Appetize.io
        run: flutter build ios --simulator --no-codesign

      - name: Compress iphonesimulator Runner.app into ZIP for Appetize.io
        run: |
          cd build/ios/iphonesimulator
          zip -r Runner.app.zip Runner.app

      - name: Upload iOS Simulator Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-runner-app
          path: build/ios/iphonesimulator/Runner.app.zip
