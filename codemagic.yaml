workflows:
  ios-simulator-workflow:
    name: iOS Simulator Build for Appetize.io
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build iOS Simulator App via xcodebuild
        script: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -sdk iphonesimulator -configuration Debug -derivedDataPath build
      - name: Zip Debug-iphonesimulator Runner.app
        script: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r Runner.app.zip Runner.app
    artifacts:
      - build/Build/Products/Debug-iphonesimulator/Runner.app.zip
