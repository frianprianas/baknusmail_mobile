name: baknusmail
description: "BaknusMail - Modern Email Client & Mailcow Manager for SMK Bakti Nusantara 666"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  enough_mail: ^2.1.7
  dio: ^5.7.0
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  flutter_widget_from_html_core: ^0.15.2
  file_picker: ^8.1.4
  open_filex: ^4.5.0
  path_provider: ^2.1.5
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0
  cloud_firestore: ^6.8.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/

